name: Go

on:
  push:
    branches: [master, fix/95-cross-platform-readiness]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go dependencies
        run: go mod download
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: GURI_AUDIT_REPORT="$RUNNER_TEMP/internal-r7rs-audit.json" GOPROXY=off GOSUMDB=off go test -timeout 5m -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Record execution platform
        run: go env GOOS GOARCH GOVERSION
      - name: Build interpreter for isolated R7RS measurements
        run: go build -o "$RUNNER_TEMP/guri-r7rs" ./cmd/guri
      - name: Check public CLI R7RS regression cases
        run: go run ./cmd/r7rscheck -program "$RUNNER_TEMP/guri-r7rs" > "$RUNNER_TEMP/r7rs-report.json"
      - name: Check public CLI imported Chibi cases
        run: go run ./cmd/r7rscheck -program "$RUNNER_TEMP/guri-r7rs" -suite testdata/r7rs/chibi/suite.json > "$RUNNER_TEMP/r7rs-chibi-report.json"
      - name: Upload R7RS measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r7rs-measurements-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/r7rs-report.json
            ${{ runner.temp }}/r7rs-chibi-report.json
            ${{ runner.temp }}/internal-r7rs-audit.json
          if-no-files-found: error
